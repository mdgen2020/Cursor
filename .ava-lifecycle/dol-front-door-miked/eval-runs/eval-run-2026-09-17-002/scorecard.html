<head>
  <title>Prefab</title>

  <style>:root {
  --destructive:#EE5656;--success:#27C27D;--warning:#F5A524;--border:color-mix(in srgb, #6B7280 22%, transparent);--muted-foreground:#6B7280;
}
.dark {
  --destructive:#EE5656;--success:#27C27D;--warning:#F5A524;--border:color-mix(in srgb, #6B7280 22%, transparent);--muted-foreground:#6B7280;
}
.pf-dialog-content{
  inset:0!important;width:100vw!important;height:100vh!important;
  max-width:none!important;max-height:none!important;
  transform:none!important;translate:none!important;border-radius:0!important;
  display:flex!important;flex-direction:column!important;overflow:auto!important;
  padding:1.5rem 2rem 2rem!important;background:#fff!important
}
.pf-dialog-overlay{background:color-mix(in srgb,#6B7280 45%,transparent)!important}
.pf-dialog-header{
  padding-right:18rem;padding-bottom:1rem;
  border-bottom:1px solid color-mix(in srgb, #6B7280 22%, transparent);margin-bottom:.5rem
}
.pf-dialog-content .detail-primary>.pf-tabs.detail-primary-tabs>.pf-tabs-list{
  position:absolute;top:1.1rem;right:5.5rem;z-index:20;padding:3px;gap:2px
}
.pf-dialog-content .detail-primary>.pf-tabs.detail-primary-tabs>.pf-tabs-list>.pf-tabs-trigger{
  padding:.35rem .85rem!important
}
.pf-dialog-close{z-index:30!important;right:1.25rem!important;top:1.25rem!important}
/* Score cards replace the detail tab list */
.score-tabs>.pf-tabs-list{display:none!important}
.score-tab{cursor:pointer}
.score-tab-hit{
  position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
  opacity:0!important;cursor:pointer!important;z-index:2
}
/* Selected card mirrors the active (hidden) tab trigger — single border, no double ring. */
.score-detail-stack:has(.score-tabs .pf-tabs-trigger:nth-child(1)[data-active]) .score-tab-criteria .pf-card,
.score-detail-stack:has(.score-tabs .pf-tabs-trigger:nth-child(1)[aria-selected="true"]) .score-tab-criteria .pf-card,
.score-detail-stack:has(.score-tabs .pf-tabs-trigger:nth-child(2)[data-active]) .score-tab-toolcheck .pf-card,
.score-detail-stack:has(.score-tabs .pf-tabs-trigger:nth-child(2)[aria-selected="true"]) .score-tab-toolcheck .pf-card,
.score-detail-stack:has(.score-tabs .pf-tabs-trigger:nth-child(3)[data-active]) .score-tab-script .pf-card,
.score-detail-stack:has(.score-tabs .pf-tabs-trigger:nth-child(3)[aria-selected="true"]) .score-tab-script .pf-card{
  background:color-mix(in srgb,#6B7280 8%,white)!important;
  border:2px solid #6B7280!important;box-shadow:none!important
}
/* Prefab divide-y uses border-bottom on each child (incl. first); soft grey, not full muted text color. */
.pf-dialog-content .divide-y>:not([hidden]),
.pf-app-root .divide-y>:not([hidden]){
  border-color:color-mix(in srgb, #6B7280 22%, transparent)!important;border-top-color:color-mix(in srgb, #6B7280 22%, transparent)!important;
  border-bottom-color:color-mix(in srgb, #6B7280 22%, transparent)!important
}
.tool-exact .pf-accordion-trigger{align-items:center;gap:.5rem;font-size:12px;font-weight:500}
.tool-exact .pf-accordion-trigger::after{
  content:"exact match";order:2;margin-left:auto;font-size:11px;font-weight:500;
  line-height:1;padding:3px 8px;border:1px solid color-mix(in srgb, #6B7280 22%, transparent);border-radius:999px;
  color:#6B7280;flex-shrink:0
}
.tool-exact .pf-accordion-trigger>svg,.tool-exact .pf-accordion-trigger>:last-child{order:3}
.traj-link .pf-accordion-trigger{
  color:#2563eb;text-decoration:underline;font-size:13px;font-weight:400;
  justify-content:flex-start;gap:.35rem;padding-block:.5rem
}
.traj-link .pf-accordion-trigger:hover{background:transparent;color:#1d4ed8}
.traj-link .pf-accordion-trigger>svg,.traj-link .pf-accordion-trigger>:last-child{display:none}

.pf-progress-variant-default,
.pf-progress-variant-success,
.pf-progress-variant-warning,
.pf-progress-variant-destructive,
.pf-progress-variant-info,
.pf-slider-variant-default,
.pf-slider-variant-success,
.pf-slider-variant-warning,
.pf-slider-variant-destructive,
.pf-slider-variant-info { background-image: none; }
.pf-ring-variant-default { stroke: var(--primary); }
.pf-ring-variant-success { stroke: var(--success); }
.pf-ring-variant-warning { stroke: var(--warning); }
.pf-ring-variant-destructive { stroke: var(--destructive); }
.pf-ring-variant-info { stroke: var(--info); }
</style>

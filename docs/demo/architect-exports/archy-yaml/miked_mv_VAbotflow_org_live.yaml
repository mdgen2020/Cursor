botFlow:
  name: miked_mv_VAbotflow
  description: Massachusetts RMV voice VA bot — miked_mv_front_door 7.0 → Call AVA; Transfer to ACD on Failure, Timeout, and escalation (sc12)
  division: Home
  startUpRef: "/botFlow/bots/bot[Default Bot_10]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
      speechToText:
        engine:
          name: Microsoft Azure
          defaultEngine: true
  settingsActionDefaults:
    callGuide:
      voiceProcessingPrompt:
        exp: "MakeCommunication(\n  ToCommunication(NOT_SET))"
    agenticAskForIntent:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForIntent:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForSlot:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForBoolean:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    loopAnythingElse:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
  settingsErrorHandling:
    errorHandling:
      exit:
        none: true
    enableAgentEscalation:
      lit: true
    errorEventHandover:
      noValue: true
    agentEscalationConfirmation:
      noValue: true
    agentEscalationHandover:
      noValue: true
    recognitionFailureEventHandover:
      noValue: true
    recognitionFailureEventHandling:
      exit:
        none: true
    agentEscalationHandling:
      exit:
        none: true
  settingsPrompts:
    ensureAudioInPrompts: false
    promptMediaToValidate:
      - mediaType: audio
      - mediaType: tts
  settingsBotFlow:
    voiceProcessingPrompt:
      noValue: true
    initialPlaybackDelay:
      lit:
        ms: 250
    minimumPlaybackTime:
      lit:
        seconds: 1
    virtualAgentEnabled: true
  settingsUserInput:
    enableBargeIn:
      lit: false
    enableAutomaticQuickReplies:
      lit: false
    noMatchesMax:
      lit: 3
    noInputsMax:
      lit: 3
    noInputsTimeout:
      lit:
        seconds: 7
    speechToTextSpeechDetectionSensitivity:
      noValue: true
    speechToTextMaxSpeechTimeout:
      noValue: true
    speechToTextAdvancedConfiguration:
      noValue: true
    enableIntentClassificationHinting:
      lit: false
    interDigitTimeout:
      lit:
        seconds: 3
    dtmfTerminatingCharacter:
      noValue: true
    confirmationRejectionsMax:
      lit: 3
    collectionLowConfidenceThreshold:
      lit: 20
    collectionHighConfidenceThreshold:
      lit: 70
    confirmationLowConfidenceThreshold:
      lit: 40
    noMatchApology:
      exp: "MakeCommunication(\n  \"Sorry.\")"
    noInputApology:
      exp: "MakeCommunication(\n  \"Sorry, I didn't hear you.\")"
    noToConfirmationApology:
      exp: "MakeCommunication(\n  \"My mistake.\")"
    confirmationNoMatchApology:
      exp: "MakeCommunication(\n  \"Sorry, please say yes or no.\")"
    confirmationNoInputApology:
      exp: "MakeCommunication(\n  \"Sorry, I didn't hear you.  Please say yes or no.\")"
  settingsKnowledge:
    none: true
  settingsVirtualAgent:
    summarization:
      lit: true
    assignWrapupCodes:
      lit: true
    enabledWrapupCodes:
      lit:
        - lit:
            name: RealID
        - lit:
            name: Account Information
        - lit:
            name: Document Information/Assistance
    conversationSummarySetting:
      name: MikeD_Summary_Config
  bots:
    - bot:
        name: Default Bot
        refId: Default Bot_10
        trackingId: 10
        actions:
          - callAgenticVirtualAgent:
              name: Call Agentic Virtual Agent
              trackingId: 12
              agenticVirtualAgent:
                miked_mv_front_door:
                  ver_latestPublished:
                    inputs:
                      first_name:
                        noValue: true
                      state_code:
                        lit: MA
                      conversation_id:
                        noValue: true
                      interaction_channel:
                        lit: voice
                    exitReason:
                      noValue: true
              outputs:
                success:
                  actions:
                    - exitBotFlow:
                        name: Exit Bot Flow
                        trackingId: 16
                failure:
                  actions:
                    - transferToAcd:
                        name: Transfer to ACD
                        trackingId: 13
                        targetQueue:
                          lit:
                            name: Support_MikeD
                        preTransferCommunication:
                          noValue: true
                        failureTransferCommunication:
                          noValue: true
                        priority:
                          lit: 0
                        preferredAgents:
                          noValue: true
                        languageSkill:
                          noValue: true
                        failureOutputs:
                          errorType:
                            noValue: true
                          errorMessage:
                            noValue: true
                timeout:
                  actions:
                    - transferToAcd:
                        name: Transfer to ACD
                        trackingId: 14
                        targetQueue:
                          lit:
                            name: Support_MikeD
                        preTransferCommunication:
                          noValue: true
                        failureTransferCommunication:
                          noValue: true
                        priority:
                          lit: 0
                        preferredAgents:
                          noValue: true
                        languageSkill:
                          noValue: true
                        failureOutputs:
                          errorType:
                            noValue: true
                          errorMessage:
                            noValue: true
          - exitBotFlow:
              name: Exit Bot Flow
              trackingId: 11

digitalBot:
  name: miked_dol_VAbotflow
  description: a bot flow for NYS dol front door
  division: Home
  startUpRef: "/digitalBot/bots/bot[Default Bot_10]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
  variables:
    - stringCollectionVariable:
        name: Flow.address1
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringCollectionVariable:
        name: Flow.address2
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.city
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringCollectionVariable:
        name: Flow.firstname
        initialValue:
          lit:
            - lit: EMPTY
        isInput: false
        isOutput: true
    - stringVariable:
        name: Flow.incident_state
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringVariable:
        name: Flow.incnumber
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringVariable:
        name: Flow.INCtoScript
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringCollectionVariable:
        name: Flow.lastname
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringVariable:
        name: Flow.priority
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringVariable:
        name: Flow.short_des
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringCollectionVariable:
        name: Flow.state
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringVariable:
        name: Flow.ticketnumber
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringCollectionVariable:
        name: Flow.zip
        initialValue:
          noValue: true
        isInput: false
        isOutput: true
    - stringVariable:
        name: Slot.cellphone1
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.email
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.FormCity
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.FormEmail
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.FormFirstName
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.FormLastName
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.FormState
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.FormZip
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.LastName
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.Name
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.TicketNumber1
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
  settingsErrorHandling:
    errorHandling:
      exit:
        none: true
    enableAgentEscalation:
      lit: false
    errorEventHandover:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Sorry, an error occurred. One moment, please, while I put you through to someone who can help.\")))"
    recognitionFailureEventHandover:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Sorry, I'm having trouble understanding you. One moment, please, while I put you through to someone who can help.\")))"
    recognitionFailureEventHandling:
      exit:
        none: true
    agentEscalationHandling:
      exit:
        none: true
  settingsBotFlow:
    virtualAgentEnabled: true
  settingsUserInput:
    noMatchesMax:
      lit: 3
    noInputsMax:
      lit: 3
    noInputsTimeout:
      lit:
        minutes: 1
    endOfSessionMessage:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"I have not heard from you in a while, so I am closing this chat, please come back if you need my help again. Thank you.\")))"
    confirmationRejectionsMax:
      lit: 3
    collectionLowConfidenceThreshold:
      lit: 20
    collectionHighConfidenceThreshold:
      lit: 70
    confirmationLowConfidenceThreshold:
      lit: 40
    noMatchApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Sorry.\")))"
    noInputApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Sorry, I didn't receive any input from you.\")))"
    noToConfirmationApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"My mistake.\")))"
    confirmationNoMatchApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Sorry, please input \\\"Yes\\\" or \\\"No\\\".\")))"
    confirmationNoInputApology:
      exp: "MakeCommunication(\n  ToCommunication(ToCommunication(\"Sorry, I didn't receive any input from you.  Please input \\\"Yes\\\" or \\\"No\\\".\")))"
  settingsKnowledge:
    none: true
  settingsVirtualAgent:
    summarization:
      lit: true
    assignWrapupCodes:
      lit: true
    conversationSummarySetting:
      name: MikeD_Summary_Config
  bots:
    - bot:
        name: Default Bot
        refId: Default Bot_10
        trackingId: 10
        actions:
          - callAgenticVirtualAgent:
              name: Call Agentic Virtual Agent
              trackingId: 12
              agenticVirtualAgent:
                DOL_Front_Door_miked:
                  ver_latestPublished:
                    inputs:
                      caller_name:
                        noValue: true
                      call_reason:
                        noValue: true
                    outputs:
                      appointment_create.key:
                        noValue: true
                      appointment_lookup.entities_key.0:
                        noValue: true
                      appointment_lookup.entities_contact_name.0:
                        noValue: true
                      appointment_lookup.entities_appt_date.0:
                        noValue: true
                      appointment_lookup.entities_appt_time.0:
                        noValue: true
                      appointment_lookup.entities_appt_addy.0:
                        noValue: true
                      appointment_lookup.entities_contact_info.0:
                        noValue: true
                      appointment_lookup.entities_appt_reason.0:
                        noValue: true
                      claim_lookup.0.number:
                        var: Flow.incnumber
                      claim_lookup.0.incident_state:
                        var: Flow.incident_state
                      handoff.contact_email:
                        var: Slot.email
                      handoff.resident_name:
                        var: Slot.Name
                      handoff.contact_last_name:
                        var: Slot.LastName
                      handoff.address_line1:
                        noValue: true
                      handoff.city:
                        noValue: true
                      handoff.state:
                        noValue: true
                      handoff.postal_code:
                        noValue: true
                    exitReason:
                      noValue: true
              outputs:
                failure:
                  actions:
                    - transferToAcd:
                        name: Transfer to ACD
                        trackingId: 13
                        targetQueue:
                          lit:
                            name: Support_MikeD
                        preTransferCommunication:
                          noValue: true
                        failureTransferCommunication:
                          noValue: true
                        priority:
                          lit: 0
                        preferredAgents:
                          noValue: true
                        languageSkill:
                          noValue: true
                        directAgent:
                          noValue: true
                        failureOutputs:
                          errorType:
                            noValue: true
                          errorMessage:
                            noValue: true
                timeout:
                  actions:
                    - transferToAcd:
                        name: Transfer to ACD
                        trackingId: 14
                        targetQueue:
                          lit:
                            name: Support_MikeD
                        preTransferCommunication:
                          noValue: true
                        failureTransferCommunication:
                          noValue: true
                        priority:
                          lit: 0
                        preferredAgents:
                          noValue: true
                        languageSkill:
                          noValue: true
                        directAgent:
                          noValue: true
                        failureOutputs:
                          errorType:
                            noValue: true
                          errorMessage:
                            noValue: true
          - callData:
              name: Hydrate external contact for handoff
              trackingId: 110
              timeout:
                lit:
                  minutes: 1
              category:
                PureCloud Data Actions:
                  dataAction:
                    External Contact by eMail - MikeD - Full:
                      inputs:
                        workEmail:
                          exp: Slot.email
                      successOutputs:
                        contacts.firstName:
                          var: Flow.firstname
                        contacts.lastName:
                          var: Flow.lastname
                        contacts.address.address1:
                          var: Flow.address1
                        contacts.address.address2:
                          var: Flow.address2
                        contacts.address.state:
                          var: Flow.state
                        contacts.address.postalCode:
                          var: Flow.zip
                        contacts.address.city:
                          var: Flow.city
                        contacts.address.countryCode:
                          noValue: true
                        contacts.workPhone.display:
                          noValue: true
                        contacts.cellPhone.display:
                          noValue: true
                        contacts.workEmail:
                          noValue: true
                      failureOutputs:
                        errorCode:
                          noValue: true
                        status:
                          noValue: true
                        correlationId:
                          noValue: true
                        entityId:
                          noValue: true
                        entityName:
                          noValue: true
                        userMessage:
                          noValue: true
                        userParamsMessage:
                          noValue: true
                        userParams.key:
                          noValue: true
                        userParams.value:
                          noValue: true
                        details.errorCode:
                          noValue: true
                        details.fieldName:
                          noValue: true
                        details.entityId:
                          noValue: true
                        details.entityName:
                          noValue: true
              outputs:
                success:
                  actions:
                    - updateData:
                        name: Update Data — INCtoScript
                        trackingId: 201
                        statements:
                          - string:
                              variable: Flow.INCtoScript
                              value:
                                exp: Flow.incnumber
                    - exitBotFlow:
                        name: Exit Bot Flow
                        trackingId: 11
                failure:
                  actions:
                    - updateData:
                        name: Update Data — INCtoScript
                        trackingId: 201
                        statements:
                          - string:
                              variable: Flow.INCtoScript
                              value:
                                exp: Flow.incnumber
                    - exitBotFlow:
                        name: Exit Bot Flow
                        trackingId: 11
                timeout:
                  actions:
                    - updateData:
                        name: Update Data — INCtoScript
                        trackingId: 201
                        statements:
                          - string:
                              variable: Flow.INCtoScript
                              value:
                                exp: Flow.incnumber
                    - exitBotFlow:
                        name: Exit Bot Flow
                        trackingId: 11
          - updateData:
              name: Update Data — INCtoScript
              trackingId: 201
              statements:
                - string:
                    variable: Flow.INCtoScript
                    value:
                      exp: Flow.incnumber
          - exitBotFlow:
              name: Exit Bot Flow
              trackingId: 11
  settingsNaturalLanguageUnderstanding:
    nluDomainVersion:
      intents: []
      entities:
        - name: cellphone
          type: "builtin:any"
        - name: email
          type: emailType
        - name: FormCity
          type: "builtin:any"
        - name: FormEmail
          type: emailType
        - name: FormFirstName
          type: "builtin:any"
        - name: FormLastName
          type: "builtin:any"
        - name: FormState
          type: "builtin:any"
        - name: FormZip
          type: "builtin:any"
        - name: LastName
          type: "builtin:any"
        - name: Name
          type: "builtin:any"
        - name: TicketNumber
          type: "builtin:any"
      entityTypes:
        - name: emailType
          description: The description of the Entity Type "emailType"
          mechanism:
            type: Regex
            restricted: true
            items:
              - value: "^\\S+@\\S+$"
                synonyms: []
      language: en-us
      languageVersions: {}
    mutedUtterances: []

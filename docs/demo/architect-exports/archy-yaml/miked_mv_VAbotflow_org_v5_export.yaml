        isInput: false
        isOutput: false
  settingsActionDefaults:
    callGuide:
      voiceProcessingPrompt:
        exp: "MakeCommunication(\n  ToCommunication(NOT_SET))"
    agenticAskForIntent:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForIntent:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForSlot:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForBoolean:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    loopAnythingElse:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
  settingsErrorHandling:
    errorHandling:
      exit:
        none: true
    enableAgentEscalation:
      lit: true
    errorEventHandover:
      noValue: true
    agentEscalationConfirmation:
      noValue: true
    agentEscalationHandover:
      noValue: true
    recognitionFailureEventHandover:
      noValue: true
    recognitionFailureEventHandling:
      exit:

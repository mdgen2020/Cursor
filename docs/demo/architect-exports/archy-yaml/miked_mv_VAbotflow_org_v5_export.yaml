      - mediaType: tts
  tasks:
    - task:
        name: MV handoff transfer
        refId: MV handoff transfer_20
        trackingId: 20
        actions:
          - callData:
              name: Hydrate external contact for handoff
              trackingId: 21
              timeout:
                lit:
                  minutes: 1
              category:
                PureCloud Data Actions:
                  dataAction:
                    External Contact by eMail - MikeD - Full:
                      inputs:
                        workEmail:
                          exp: Flow.CustEmail
                      successOutputs:
                        contacts.firstName:
                          var: Flow.firstname
                        contacts.lastName:
                          var: Flow.lastname
                        contacts.address.address1:
                          var: Flow.address1
                        contacts.address.address2:
                          noValue: true
                        contacts.address.state:
                          var: Flow.state
                        contacts.address.postalCode:
                          var: Flow.zip
                        contacts.address.city:
                          var: Flow.city
                        contacts.address.countryCode:
                          noValue: true
                        contacts.workPhone.display:
                          noValue: true
                        contacts.cellPhone.display:
                          noValue: true
                        contacts.workEmail:
                          noValue: true
                      failureOutputs:
                        errorCode:
                          noValue: true
                        status:
                          noValue: true
                        correlationId:
                          noValue: true
                        entityId:
                          noValue: true
                        entityName:
                          noValue: true
                        userMessage:
                          noValue: true
                        userParamsMessage:
                          noValue: true
                        userParams.key:
                          noValue: true
                        userParams.value:
                          noValue: true
                        details.errorCode:
                          noValue: true
                        details.fieldName:
                          noValue: true
                        details.entityId:
                          noValue: true
                        details.entityName:
                          noValue: true

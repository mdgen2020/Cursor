              statements:
                - integer:
                    variable: Flow.IBVivrselection
                    value:
                      lit: 123
          - callAgenticVirtualAgent:
              name: Call Agentic Virtual Agent
              trackingId: 12
              agenticVirtualAgent:
                miked_mv_front_door:
                  ver_latestPublished:
                    inputs:
                      first_name:
                        noValue: true
                      state_code:
                        lit: MA
                      conversation_id:
                        noValue: true
                      interaction_channel:
                        lit: voice
                    exitReason:
                      noValue: true
              outputs:

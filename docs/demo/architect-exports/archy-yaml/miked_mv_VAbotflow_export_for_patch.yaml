          - updateData:
              name: Resolve CustEmail from verify or handoff
              trackingId: 40
              statements:
                - string:
                    variable: Flow.CustEmail
                    value:
                      exp: "If(IsNotSetOrEmpty(ToDisplayString(Flow.CustEmail)), ToDisplayString(Flow.VerifiedCustEmail), ToDisplayString(Flow.CustEmail))"

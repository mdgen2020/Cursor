                        workEmail:
                          exp: Flow.CustEmail
                      successOutputs:
                        contacts.firstName:
                          var: Flow.firstname
                        contacts.lastName:
                          var: Flow.lastname
                        contacts.address.address1:
                          var: Flow.address1
                        contacts.address.address2:
                          noValue: true
                        contacts.address.state:
                          var: Flow.state
                        contacts.address.postalCode:
                          var: Flow.zip
                        contacts.address.city:
                          var: Flow.city
                        contacts.address.countryCode:
                          noValue: true
                        contacts.workPhone.display:
                          var: Flow.contactPhone
                        contacts.cellPhone.display:
                          var: Flow.contactPhone
                        contacts.workEmail:
                          noValue: true
                      failureOutputs:
                        errorCode:
                          noValue: true
                        status:
                          noValue: true
                        correlationId:
                          noValue: true
                        entityId:
                          noValue: true
                        entityName:
                          noValue: true
                        userMessage:
                          noValue: true
                        userParamsMessage:
                          noValue: true
                        userParams.key:
                          noValue: true
                        userParams.value:
                          noValue: true
                        details.errorCode:
                          noValue: true
                        details.fieldName:
                          noValue: true
                        details.entityId:
                          noValue: true
                        details.entityName:
                          noValue: true
              outputs:
                success:
                  actions:
                    - callData:
                        name: Get voice communication id
                        trackingId: 41
                        timeout:
                          lit:
                            minutes: 1
                        category:
                          Vivek - Genesys Cloud Data Actions:
                            dataAction:
                              Get Message CommunicationID:
                                inputs:
                                  ConvoID:
                                    exp: Session.ConversationID
                                successOutputs:
                                  CommunicationID:
                                    var: Flow.CommID
                                failureOutputs:

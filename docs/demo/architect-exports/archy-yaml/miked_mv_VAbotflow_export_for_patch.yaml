              name: Seed IBV for script router
              trackingId: 15
              statements:
                - integer:
                    variable: Flow.IBVivrselection
                    value:
                      lit: 123
          - callAgenticVirtualAgent:
              name: Call Agentic Virtual Agent
              trackingId: 12
              agenticVirtualAgent:
                miked_mv_front_door:
                  ver_latestPublished:
                    inputs:
                      first_name:
                        noValue: true
                      state_code:
                        lit: MA
                      conversation_id:
                        noValue: true
                      interaction_channel:
                        lit: voice
                    outputs:
                      session.contact_email:
                        var: Flow.VerifiedCustEmail
                      handoff.contact_email:
                        var: Flow.CustEmail
                      handoff.intent_summary:
                        var: Flow.HandoffSummary
                      handoff.handoff_id:
                        var: Flow.TicketNumber
                      handoff.genesys_external_contact_id:

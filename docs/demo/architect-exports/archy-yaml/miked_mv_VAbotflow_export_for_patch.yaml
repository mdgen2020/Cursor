  settingsBotFlow:
    voiceProcessingPrompt:
      noValue: true
    initialPlaybackDelay:
      lit:
        ms: 250
    minimumPlaybackTime:
      lit:
        seconds: 1
    virtualAgentEnabled: true
  settingsUserInput:
    enableBargeIn:
      lit: false
    enableAutomaticQuickReplies:
      lit: false
    noMatchesMax:
      lit: 3
    noInputsMax:
      lit: 3
    noInputsTimeout:
      lit:
        seconds: 7
    speechToTextSpeechDetectionSensitivity:
      noValue: true
    speechToTextMaxSpeechTimeout:
      noValue: true
    speechToTextAdvancedConfiguration:
      noValue: true
    enableIntentClassificationHinting:
      lit: false
    interDigitTimeout:
      lit:
        seconds: 3
    dtmfTerminatingCharacter:
